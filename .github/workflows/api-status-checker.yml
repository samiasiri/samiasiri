name: API Status Checker CI

on:
  push:
    paths:
      - "projects/api-status-checker/**"
      - ".github/workflows/api-status-checker.yml"
  pull_request:
    paths:
      - "projects/api-status-checker/**"
      - ".github/workflows/api-status-checker.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/api-status-checker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check
        run: python -m py_compile api_status_checker.py

      - name: Run offline checks
        run: |
          python - <<'PY'
          import api_status_checker as app

          assert app.normalize_url("example.com") == "https://example.com"
          assert app.normalize_url("http://example.com") == "http://example.com"
          assert app.load_urls(["example.com", "example.com"], None) == ["https://example.com"]
          print("offline checks passed")
          PY
